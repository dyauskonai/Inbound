<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbound · ER arrivals</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Dark by default, like a resus room monitor; light if this screen chose it. -->
    <script>
      try {
        if (localStorage.getItem("inbound-theme") === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
